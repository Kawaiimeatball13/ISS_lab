<!DOCTYPE html>
<html lang="en">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title}"></title>
    <link rel="stylesheet" th:href="@{/styles/main_page_css.css}">
    <link rel="stylesheet" th:href="@{/styles/page_layout_css.css}">
    <link rel="stylesheet" th:href="@{/styles/menu_css.css}">
    <link rel="stylesheet" th:href="@{/styles/main_page_css.css}">
    <link rel="stylesheet" th:href="@{/styles/article_editor.css}">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
<div id="menu_bar">
  <ul id="menu_content">
    <li>
      <div class="webiste_title"><a href="http://localhost:8080">Agora &#238;n re&#355;ea</a></div>
    </li>
    <li>
      <div class="user_data">
        <div class="user_photo"><img th:src="@{/images/placeholder.JPG}" alt="profile_picture" width="50" height="50"></div>
        <div class="user_name" id="username_div">Username</div>
      </div>
    </li>
  </ul>
</div>
<div id="entire_page">
  <div id="entire_content">
      <h2 th:text="${article.title}"></h2>
      <h3 th:text="${article.author.name} + ' ' + ${article.author.familyName}"></h3>
      <div id="article_content"></div>

      <script th:inline="javascript">
          /*<![CDATA[*/
          const content = /*[[${article_content.content}]]*/ 'default';
          /*]]>*/

          document.getElementById("article_content").innerHTML = content;
      </script>
  </div>
</div>
</body>
</html>
